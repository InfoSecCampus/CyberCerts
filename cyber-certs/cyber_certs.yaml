# Cybersecurity Certifications
# Curated by InfoSec Campus

meta:
  title: "Cybersecurity Certifications"
  curator: "InfoSec Campus"
  curator_url: "https://infoseccampus.com"
  last_updated: "2026-09-24"
  inspired_by:
    name: "Paul Jerimy"
    work: "Security Certification Roadmap"
    url: "https://pauljerimy.com/security-certification-roadmap/"
    note: "The domain/level taxonomy and the idea of one page mapping the whole certification market are his. This file's own entries are original research, not copied from his chart -- see DATA_LICENSE.md for how the two combine on the roadmap page."
  license: "CC BY-SA 4.0"
  license_url: "https://creativecommons.org/licenses/by-sa/4.0/"

certs:
  # ---------------- AI / LLM security (checked 2026-09-21; see the blog post for details) ----------------
  - id: taise
    name: TAISE
    full: Trusted AI Safety Expert
    issuer: Cloud Security Alliance
    url: https://cloudsecurityalliance.org/education/taise
    domain: Security and Risk Management
    level: beginner
    cost: "$795 (training + exam, two attempts)"
    note: Sold only as a training + exam bundle. Ten modules across the AI lifecycle.

  - id: secai
    name: SecAI+
    full: CompTIA SecAI+ (CY0-001)
    issuer: CompTIA
    url: https://www.comptia.org/en-us/certifications/secai/
    domain: Security Architecture and Engineering
    level: intermediate
    cost: "~$359"
    note: "Launched 17 Feb 2026."

  - id: caisp
    name: CAISP
    full: Certified AI Security Professional
    issuer: Practical DevSecOps
    url: https://www.practical-devsecops.com/certified-ai-security-professional/
    domain: Software Security
    level: intermediate
    cost: "$1,099 (course + one attempt)"
    note: Lifetime credential. Covers OWASP LLM Top 10, MITRE ATLAS, AI supply chain, NIST AI RMF and ISO 42001.

  - id: gaips
    name: GAIPS
    full: GIAC AI Platform Security
    issuer: GIAC / SANS
    url: https://www.giac.org/focus-areas/artificial-intelligence
    domain: Software Security
    level: intermediate
    cost: "~$999"
    note: Audit and secure GenAI applications and LLM development pipelines. Mapped to SEC545.

  - id: sc500
    name: SC-500
    full: Microsoft Cloud and AI Security Engineer Associate
    issuer: Microsoft
    url: https://learn.microsoft.com/en-us/credentials/certifications/cloud-and-ai-security-engineer-associate/
    domain: Security Architecture and Engineering
    level: intermediate
    cost: Varies by country
    note: Securing AI workloads is one part of a broader Azure security exam, not the whole thing.

  - id: osai
    name: OSAI
    full: OffSec AI Red Teamer (AI-300)
    issuer: OffSec
    url: https://www.offsec.com/courses/ai-300/
    domain: Security Operations
    level: expert
    team: red
    cost: "$1,749 (course + cert bundle, 90 days access, one attempt)"
    note: OSAI does not expire. The OSAI+ designation lasts three years.

  - id: coae
    name: HTB COAE
    full: HTB Certified Offensive AI Expert
    issuer: Hack The Box
    url: https://academy.hackthebox.com/news/the-new-htb-certified-offensive-ai-expert-htb-coae-is-officially-here
    domain: Security Operations
    level: expert
    team: red
    cost: "$490 Silver Annual subscription incl. voucher (two attempts)"
    note: Announced 2 Apr 2026.

  - id: goaa
    name: GOAA
    full: GIAC Offensive AI Analyst
    issuer: GIAC / SANS
    url: https://www.giac.org/focus-areas/artificial-intelligence
    domain: Security Operations
    level: intermediate
    team: red
    cost: "~$999"
    note: Mapped to SEC535, Offensive AI attack tools and techniques.

  - id: coasp
    name: C|OASP
    full: Certified Offensive AI Security Professional
    issuer: EC-Council
    url: https://iclass.eccouncil.org/product/certified-offensive-ai-security-professional-coasp/
    domain: Security Operations
    level: intermediate
    team: red
    cost: "$2,199 (course, labs and exam)"
    note: Ten modules covering LLM red teaming, agentic AI attacks, adversarial ML and AI supply chain.

  - id: airtp
    name: AIRTP+
    full: AI Red Teaming Professional
    issuer: Learn Prompting
    url: https://learnprompting.org/certificates/ai-red-teaming-professional-certification
    domain: Security Operations
    level: intermediate
    team: red
    cost: "$299 exam only, $1,199 with course"

  - id: gasae
    name: GASAE
    full: GIAC AI Security Automation Engineer
    issuer: GIAC / SANS
    url: https://www.giac.org/focus-areas/artificial-intelligence
    domain: Security Operations
    level: intermediate
    cost: "~$999"
    note: Using AI to automate red, blue and purple team work. Mapped to SEC598.

  - id: aaism
    name: AAISM
    full: ISACA Advanced in AI Security Management
    issuer: ISACA
    url: https://www.isaca.org/credentialing/aaism
    domain: Security and Risk Management
    level: expert
    cost: "$459 member / $599 non-member + $50 application"
    note: Requires an active CISM or CISSP.

  - id: aaia
    name: AAIA
    full: ISACA Advanced in AI Audit
    issuer: ISACA
    url: https://www.isaca.org/credentialing/aaia
    domain: Security Assessment and Testing
    level: expert
    cost: "$459 member / $599 non-member + $50 application"
    note: Requires CISA, or another IT-audit-focused accounting designation.

  - id: aigp
    name: AIGP
    full: Artificial Intelligence Governance Professional
    issuer: IAPP
    url: https://iapp.org/certify/aigp
    domain: Security and Risk Management
    level: intermediate
    cost: "$649 member / $799 non-member"
    note: Governance, law and lifecycle risk rather than technical security.

  - id: iso42001li
    name: ISO 42001 LI
    full: ISO/IEC 42001 Lead Implementer
    issuer: PECB
    url: https://pecb.com/en/education-and-certification-for-individuals/iso-iec-42001/iso-iec-42001-lead-implementer
    domain: Security and Risk Management
    level: intermediate
    cost: Exam included in the course fee
    note: AI management system implementation, four credential tiers gated by experience.

  - id: iso42001la
    name: ISO 42001 LA
    full: ISO/IEC 42001 Lead Auditor
    issuer: PECB
    url: https://pecb.com/en/education-and-certification-for-individuals/iso-iec-42001/iso-iec-42001-lead-auditor
    domain: Security Assessment and Testing
    level: intermediate
    cost: Exam included in the course fee

