  - id: sailpoint-iiq-pro
    name: SailPoint IIQ Pro
    full: SailPoint Certified IdentityIQ Professional
    issuer: SailPoint
    url: https://university.sailpoint.com/
    domain: Identity and Access Management
    level: intermediate
    cost: "$300 exam"

  - id: sailpoint-ise
    name: SailPoint ISE
    full: SailPoint Certified Identity Security Engineer
    issuer: SailPoint
    url: https://www.isecprep.com/2026/08/21/sailpoint-certified-identity-security-engineer-exam/
    domain: Identity and Access Management
    level: expert
    cost: "$400 exam"

  - id: ping-cp-pingone
    name: Ping CP
    full: Certified Professional - PingOne
    issuer: Ping Identity
    url: https://training.pingidentity.com/certification
    domain: Identity and Access Management
    level: intermediate
    cost: "~$395 exam"

  - id: delinea-ce-ss
    name: Delinea CE
    full: Delinea Certified Engineer - Secret Server
    issuer: Delinea (Thycotic)
    url: https://delinea.com/news/thycotic-launches-global-secret-server-certification-program
    domain: Identity and Access Management
    level: intermediate
    cost: "$250 exam"
    note: 50 questions, 60 minutes, valid 2 years.

  # ---------------- Offensive security / red team ----------------
  - id: crtp
    name: CRTP
    full: Certified Red Team Professional
    issuer: Altered Security
    url: https://www.alteredsecurity.com/post/certified-red-team-professional-crtp
    domain: Security Operations
    level: intermediate
    team: red
    cost: "$249 (30-day lab + exam attempt); $99 re-attempt"
    note: Active Directory red teaming fundamentals.

  - id: crte
    name: CRTE
    full: Certified Red Team Expert
    issuer: Altered Security
    url: https://www.alteredsecurity.com/redteamlab
    domain: Security Operations
    level: expert
    team: red
    cost: "$299 (30-day lab + one exam attempt)"
    note: Advanced Active Directory / enterprise red teaming, follow-on to CRTP.

  # ---------------- Digital forensics ----------------
  - id: mcfe
    name: MCFE
    full: Magnet Certified Forensics Examiner
    issuer: Magnet Forensics
